<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="meta-title">Mentions légales – Procom Solution</title>
  <meta name="description" id="meta-desc" content="Mentions légales du site Procom Solution"/>
  <meta name="robots" content="noindex,follow"/>
  <link rel="icon" href="assets/logo-court.png" type="image/png"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);color:var(--text-dark);background:var(--white);line-height:1.6;}
    a{text-decoration:none;color:inherit;}
    .container{width:90%;max-width:860px;margin:0 auto;}
    header{position:sticky;top:0;z-index:100;background:var(--white);border-bottom:1px solid rgba(17,35,56,.08);}
    nav{display:flex;align-items:center;justify-content:space-between;height:72px;}
    .nav-logo img{height:64px;width:auto;display:block;}
    .nav-links{display:flex;gap:32px;list-style:none;}
    .nav-links a{font-size:.9rem;font-weight:500;color:var(--text-mid);}
    .nav-links a:hover{color:var(--turquoise);}
    .btn-nav{background:var(--turquoise);color:var(--white)!important;padding:10px 22px;border-radius:50px;font-weight:600;}
    .btn-nav:hover{background:var(--navy);}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;}
    .hamburger span{width:24px;height:2px;background:var(--navy);}
    .mobile-menu{display:none;flex-direction:column;background:var(--white);border-top:1px solid rgba(17,35,56,.08);padding:20px;gap:14px;}
    .mobile-menu.open{display:flex;}
    .page-hero{background:linear-gradient(135deg,var(--navy) 0%,#1a3a5c 100%);padding:64px 0 48px;text-align:center;color:var(--white);}
    .page-hero .label{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--turquoise);background:rgba(80,158,164,.15);padding:6px 16px;border-radius:50px;margin-bottom:18px;}
    .page-hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:700;}
    .legal-content{padding:64px 0 80px;}
    .legal-content h2{font-size:1.2rem;font-weight:700;color:var(--navy);margin:32px 0 12px;padding-bottom:8px;border-bottom:2px solid rgba(80,158,164,.18);}
    .legal-content h2:first-of-type{margin-top:0;}
    .legal-content p{font-size:.97rem;color:var(--text-mid);margin-bottom:14px;}
    .legal-content a{color:var(--turquoise);font-weight:500;}
    .legal-content a:hover{text-decoration:underline;}
    .legal-content strong{color:var(--navy);}
    footer{background:var(--navy);color:rgba(255,255,255,.75);padding:48px 0;}
    .footer-bottom{text-align:center;font-size:.85rem;}
    .footer-bottom a{color:rgba(255,255,255,.85);margin:0 12px;}
    .footer-bottom a:hover{color:var(--turquoise);}
    @media(max-width:768px){.nav-links{display:none;}.hamburger{display:flex;}}
  </style>
</head>
<body data-page="legal-mentions">
<a class="skip-link" href="#main">Aller au contenu</a>

<header>
  <div class="container">
    <nav>
      <a href="index.html" class="nav-logo"><img id="nav-logo-img" src="assets/logo-long.png" alt="Procom Solution"/></a>
      <ul class="nav-links" id="nav-links-desktop"></ul>
      <div class="hamburger" onclick="document.getElementById('mobileMenu').classList.toggle('open')"><span></span><span></span><span></span></div>
    </nav>
  </div>
  <div class="mobile-menu" id="mobileMenu"></div>
</header>

<section class="page-hero">
  <div class="container">
    <span class="label">Information</span>
    <h1 id="legal-title">Mentions légales</h1>
  </div>
</section>

<main id="main" class="legal-content">
  <div class="container" id="legal-body">
    <p style="color:var(--text-light)">Chargement…</p>
  </div>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">
      <p id="footer-copy">© 2026 Procom Solution. Tous droits réservés.</p>
      <div style="margin-top:12px"><a href="mentions-legales.html">Mentions légales</a> · <a href="confidentialite.html">Confidentialité</a> · <a href="index.html">Accueil</a></div>
    </div>
  </div>
</footer>

<script src="cms.js"></script>
<script>
(function(){
  const cfg = CMS.load();
  // nav
  const ds = document.getElementById('nav-links-desktop');
  const mo = document.getElementById('mobileMenu');
  const links = (cfg.nav&&cfg.nav.links)||[];
  // Préfixe les ancres internes (#xxx) avec index.html puisque cette page n'a pas ces sections
  const fix = h => (h && h.charAt(0)==='#') ? ('index.html'+h) : (h||'#');
  const cta = fix(cfg.nav&&cfg.nav.ctaHref) || 'index.html#contact';
  if(ds) ds.innerHTML = links.map(l=>`<li><a href="${fix(l.href)}">${l.label}</a></li>`).join('') + `<li><a class="btn-nav" href="${cta}">${(cfg.nav&&cfg.nav.ctaText)||'Prendre RDV'}</a></li>`;
  if(mo) mo.innerHTML = links.map(l=>`<a href="${fix(l.href)}">${l.label}</a>`).join('') + `<a class="btn-nav" href="${cta}">${(cfg.nav&&cfg.nav.ctaText)||'Prendre RDV'}</a>`;
  if(cfg.nav&&cfg.nav.logo) document.getElementById('nav-logo-img').src = cfg.nav.logo;
  // colors
  CMS.applyColors(cfg.colors||{});
  // content
  const isConf = window.location.pathname.endsWith('confidentialite.html');
  const lg = cfg.legal||{};
  document.getElementById('legal-title').textContent = isConf ? (lg.confidentialiteTitle||'Politique de confidentialité') : (lg.mentionsTitle||'Mentions légales');
  document.title = (isConf ? 'Confidentialité' : 'Mentions légales') + ' – Procom Solution';
  document.getElementById('legal-body').innerHTML = isConf ? (lg.confidentialite||'<p>Contenu à venir.</p>') : (lg.mentions||'<p>Contenu à venir.</p>');
  // footer
  if(cfg.footer&&cfg.footer.copyright) document.getElementById('footer-copy').textContent = cfg.footer.copyright;
})();
</script>
</body>
</html>
